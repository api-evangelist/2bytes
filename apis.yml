aid: 2bytes
name: 2bytes
description: '2bytes Corporation (투바이트) is a South Korean game services and publishing
  company founded in 2020 in Seoul, providing game localization, QA testing, player
  support, content marketing, live operations and global launch support to more than
  40 game company partners including Pearl Abyss and Kakao Games. The company also
  builds and operates an H5 (HTML5) game platform that runs in-app without installation,
  covering platform construction, global H5 game sourcing, localization and live
  operations, integrated by partner apps through an SDK. Its service brand is 2bytes
  Play. As of this profile 2bytes publishes no public developer portal, API reference,
  or machine-readable API contract; the H5 platform SDK is offered through a business
  contact channel rather than a self-serve developer program.'
